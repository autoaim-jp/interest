<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>趣味と関心 | Yuma Toyooka</title>

      content="ウイスキー、DIY、ボードゲーム、ピアノ、バイク、キャンプ、ドライブ、ハンバーガーなど、Yuma Toyookaの趣味と関心をまとめるサイトです。"

    <link rel="canonical" href="https://interest.toyooka.me/">

  <body>
    <header class="site-header">
